        function extractJSON(text) {
            if (!text) return null;
            try { return JSON.parse(text); } catch (e) {}
            const cleaned = text.replace(/```json/gi, '').replace(/```/g, '').trim();
            try { return JSON.parse(cleaned); } catch (e) {}
            const matchObj = cleaned.match(/\{[\s\S]*\}/);
            if (matchObj) { try { return JSON.parse(matchObj[0]); } catch (e) {} }

            if (matchArr) { try { return JSON.parse(matchArr[0]); } catch (e) {} }
            return null;

        function generateFallbackStoryboards(durationObj, style, charObj, title, storyText, lang) {
            const count = durationObj?.storyboards || 3;

            // Bagilah cerita menjadi beberapa bagian untuk setiap storyboard
            for (let i = 1; i <= count; i++) {
                const progress = i / count;
                const startIdx = Math.floor((i - 1) / count * totalParas);

                if (i === 1) sceneType = 'Pengenalan & Awal Konflik';
                else if (i === count) sceneType = 'Klimaks & Penyelesaian';
                
                // Continuity notes untuk memastikan urutan
                const prevBoardId = i > 1 ? i - 1 : null;
                const nextBoardId = i < count ? i + 1 : null;
                const continuityNote = prevBoardId 
                    ? `🔗 LANJUTAN DARI Storyboard #${prevBoardId} - Adegan ${i} adalah kelanjutan langsung dari adegan sebelumnya`
                    : `🏁 PEMBUKA CERITA - Memulai petualangan`;
                
                const nextNote = nextBoardId 
                    ? `⏭️ BERSAMBUNG KE Storyboard #${nextBoardId} - Adegan ini akan berlanjut ke adegan berikutnya`
                    : `🏁 AKHIR CERITA - Kesimpulan dari petualangan`;

                boards.push({
                    storyboardId: i,
                    sceneTitle: `Adegan ${i}: ${sceneType} (${i}/${count}) - ${title}`,
                    locationAndTime: `Lokasi: Lanjutan dari adegan sebelumnya - Siang Hari`,
                    continuityNotes: `${continuityNote} | ${nextNote}`,
                    scriptSegment: currentSectionText.substring(0, 500),
                    panels: [
                        { panelNum: 1, action: `[LANJUTAN] ${charName} melanjutkan aksi dari adegan sebelumnya`, dialogue: `Adegan ${i} dimulai...` },
                        { panelNum: 2, action: `${charName} menghadapi situasi baru yang merupakan konsekuensi dari adegan sebelumnya`, dialogue: `Sekarang bagaimana?` },
                        { panelNum: 3, action: `Konflik atau tantangan utama di adegan ${i} muncul`, dialogue: `Ini adalah bagian penting!` },
                        { panelNum: 4, action: `${charName} mengambil tindakan berdasarkan pelajaran dari adegan sebelumnya`, dialogue: `Aku tahu apa yang harus dilakukan!` },
                        { panelNum: 5, action: `Hasil dari tindakan ${charName} mulai terlihat`, dialogue: `Kita hampir sampai!` },
                        { panelNum: 6, action: `Transisi ke adegan berikutnya ${nextBoardId ? `(Storyboard #${nextBoardId})` : '(Akhir Cerita)'}`, dialogue: `Bersambung...` }
                    ],
                    imagePrompt: `A 6-panel comic grid layout, ${style} art style. ${charSnippet}. CONTINUITY: This is scene ${i} of ${count}, directly continuing from previous scene. Scene context: "${currentSectionText.substring(0, 100)}...". Panel 1-6 shows continuous progression: continuing action, new challenge, conflict, action, result, transition to next scene. Vibrant cartoon lighting, high continuity, 6-panel comic book format. Spoken dialogue in ${lang}.`,
                    videoPrompt: `Omni Flash / Sora Video Prompt (Storyboard #${i} of ${count}): CONTINUOUS SEQUEL to previous scene. Cinematic smooth camera pan, ${charSnippet}. Action: ${charName} continues the story from where it left off in "${currentSectionText.substring(0, 80)}...". IMPORTANT: All characters MUST speak their dialogue out loud with clear voice in ${lang} language. This is a direct continuation of the story - events flow naturally from previous scene. Dynamic cartoon motion, lighting matching ${style}, max 10s.`
                });
            }

            return boards;
        }

        async function callUniversalAI(prompt, provider, model, openrouterKey, geminiKey, systemInstruction = "") {
            if (provider === 'openrouter') {
                if (!openrouterKey || openrouterKey.trim() === "") {
                    throw new Error("NO_KEY: Silakan masukkan OpenRouter API Key di menu API Settings.");
                }

                const endpoint = "https://openrouter.ai/api/v1/chat/completions";
                const messages = [];
                if (systemInstruction) messages.push({ role: "system", content: systemInstruction });
                messages.push({ role: "user", content: prompt });

                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${openrouterKey.trim()}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href || "https://github.com",
                        "X-Title": "AI Viral Kids Studio"
                    },
                    body: JSON.stringify({
                        model: model || "openrouter/free",
                        messages: messages,
                        temperature: 0.6
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `OpenRouter API Error (${response.status})`);
                }

                const data = await response.json();
                return data.choices?.[0]?.message?.content || "";
            } else {
                if (!geminiKey || geminiKey.trim() === "") {
                    throw new Error("NO_KEY: Silakan masukkan Google Gemini API Key di menu API Settings.");
                }

                const modelToUse = model || "gemini-2.5-flash";
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelToUse}:generateContent?key=${geminiKey.trim()}`;

                const requestBody = { contents: [{ role: "user", parts: [{ text: prompt }] }] };
                if (systemInstruction) {
                    requestBody.systemInstruction = { parts: [{ text: systemInstruction }] };
                }

                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    if (response.status === 429 || errData.error?.message?.toLowerCase().includes("quota")) {
                        throw new Error("QUOTA_EXCEEDED: Rate limit/kuota Gemini API tercapai.");
                    }
                    throw new Error(errData.error?.message || `Gemini API Request failed (${response.status})`);
                }

                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            }
        }

        const exportAsFile = (content, filename, type) => {
            const blob = new Blob([content], { type: type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

                                                <p className="text-[#a0b4d0] bg-[#080c18] p-3 rounded-xl border border-[#1a2a4a]">{thumbnailData.visualConcept}</p>
                                            </div>

                                            <div className="space-y-2">
                                                <div className="flex justify-between items-center">
                                                    <span className="text-xs font-extrabold text-[#a855f7]">Prompt Thumbnail (Midjourney / Imagen)</span>
                                                    <button
                                                        onClick={() => copyToClipboard(thumbnailData.readyPrompt, "Prompt Thumbnail")}
                                                        className="text-[11px] text-[#a855f7] font-bold hover:underline flex items-center space-x-1"
                                                    >
                                                        <Icons.Copy />
                                                        <span>Salin Prompt</span>
                                                    </button>
                                                </div>
                                                <p className="text-xs font-mono text-[#a0b4d0] bg-[#080c18] p-3 rounded-xl border border-[#1a2a4a]">
                                                    {thumbnailData.readyPrompt}
                                                </p>
                                            </div>
                                        </div>
                                    )}

                                    {seoData && (
                                        <div className="card-dark space-y-5">
                                            <div className="flex items-center space-x-2 text-emerald-400 font-extrabold text-xs uppercase tracking-wider">
                                                <span>🏷️ YOUTUBE SEO METADATA PACKAGE ({language.toUpperCase()})</span>
                                                <span className="voice-badge text-[8px]">
                                                    <Icons.Mic />
                                                    BERSUARA
                                                </span>
                                            </div>

                                            <div className="space-y-2">
                                                <label className="text-xs font-bold text-[#667799] block">5 Opsi Judul Video YouTube SEO High-CTR</label>
                                                <div className="space-y-2">
                                                    {seoData.seoTitles?.map((t, i) => (
                                                        <div key={i} className="flex justify-between items-center bg-[#080c18] p-3 rounded-xl border border-[#1a2a4a] text-xs text-[#a0b4d0]">
                                                            <span className="font-bold">{i + 1}. {t}</span>
                                                            <button onClick={() => copyToClipboard(t, `Judul ${i + 1}`)} className="text-[#a855f7] font-bold text-[11px] hover:underline flex items-center space-x-1">
                                                                <Icons.Copy />
                                                                <span>Salin</span>
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="space-y-2">
                                                <div className="flex justify-between items-center">
                                                    <label className="text-xs font-bold text-[#667799]">Deskripsi Video YouTube</label>
                                                    <button onClick={() => copyToClipboard(seoData.videoDescription, "Deskripsi Video")} className="text-[#a855f7] font-bold text-[11px] hover:underline flex items-center space-x-1">
                                                        <Icons.Copy />
                                                        <span>Salin Deskripsi</span>
                                                    </button>
                                                </div>
                                                <textarea
                                                    rows={5}
                                                    readOnly
                                                    value={seoData.videoDescription}
                                                    className="input-dark resize-none"
                                                />
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                                <div className="space-y-1">
                                                    <span className="font-bold text-[#445566] block uppercase text-[10px]">Hashtags & Tags</span>
                                                    <p className="bg-[#080c18] p-3 rounded-xl border border-[#1a2a4a] text-[#a855f7] font-bold">{seoData.hashtags}</p>
                                                    <p className="bg-[#080c18] p-3 rounded-xl border border-[#1a2a4a] text-[#a0b4d0] mt-1">{seoData.youtubeTags?.join(', ')}</p>
                                                </div>

                                                <div className="space-y-1">
                                                    <span className="font-bold text-[#445566] block uppercase text-[10px]">Komentar Tersemat (Pinned Comment)</span>
                                                    <p className="bg-amber-500/10 p-3 rounded-xl border border-amber-500/30 text-amber-400 italic">{seoData.pinnedComment}</p>
                                                </div>
                                            </div>

                                        </div>
                                    )}

                                    {!thumbnailData && !seoData && (
                                        <div className="text-center py-16 card-dark border-[#1a2a4a] text-[#667799] text-xs shadow-sm">
                                            Belum ada metadata SEO & Thumbnail. Jalankan pipeline produksi di menu <button onClick={() => setActiveTab('studio')} className="text-[#a855f7] underline font-bold">Studio Setup</button>.
                                        </div>
                                    )}

                                </div>
                            )}

                            {/* TAB 5: EXPORT */}
                            {activeTab === 'export' && (
                                <div className="max-w-4xl mx-auto space-y-6">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <span className="text-xs font-extrabold text-[#6c5ce7] uppercase tracking-widest">Step 10 Output</span>
                                            <h2 className="text-2xl font-black text-white mt-0.5">Production Package Export</h2>
                                            <p className="text-xs text-[#667799]">Download your synchronized animation package in TXT, Markdown, or DOCX formats.</p>
                                            <div className="mt-1 voice-badge">
                                                <Icons.Mic />
                                                🎤 Semua video prompt WAJIB berisi perintah karakter bersuara dalam {language}
                                            </div>
                                            <div className="mt-1 text-[10px] text-[#10b981]">
                                                📌 Storyboards dibuat URUT & BERKESINAMBUNGAN
                                            </div>
                                        </div>

                                        <button
                                            onClick={() => copyToClipboard(generateFullPackageText('md'), "Full Production Package")}
                                            className="btn-primary flex items-center space-x-1.5 text-xs px-4 py-2"
                                        >
                                            <Icons.Copy />
                                            <span>Copy Full Package</span>
                                        </button>
                                    </div>

                                    <div className="card-dark space-y-4">
                                        <span className="text-xs font-extrabold text-[#667799] uppercase tracking-wider block">Download Formats</span>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                            <button
                                                onClick={() => exportAsFile(generateFullPackageText('txt'), `${selectedTitle || 'Animation_Package'}.txt`, 'text/plain')}
                                                className="p-4 rounded-2xl bg-[#080c18] border border-[#1a2a4a] hover:border-[#6c5ce7]/50 hover:bg-[#1a2a4a] text-left transition space-y-1"
                                            >
                                                <span className="text-xl">📄</span>
                                                <div className="font-extrabold text-xs text-white">Export TXT</div>
                                                <div className="text-[10px] text-[#667799]">Plain text format</div>
                                            </button>

                                            <button
                                                onClick={() => exportAsFile(generateFullPackageText('md'), `${selectedTitle || 'Animation_Package'}.md`, 'text/markdown')}
                                                className="p-4 rounded-2xl bg-[#080c18] border border-[#1a2a4a] hover:border-[#6c5ce7]/50 hover:bg-[#1a2a4a] text-left transition space-y-1"
                                            >
                                                <span className="text-xl">📝</span>
                                                <div className="font-extrabold text-xs text-white">Export Markdown</div>
                                                <div className="text-[10px] text-[#667799]">Formatted MD</div>
                                            </button>

                                            <button
                                                onClick={() => exportAsFile(generateFullPackageText('txt'), `${selectedTitle || 'Animation_Package'}.doc`, 'application/msword')}
                                                className="p-4 rounded-2xl bg-[#080c18] border border-[#1a2a4a] hover:border-[#6c5ce7]/50 hover:bg-[#1a2a4a] text-left transition space-y-1"
                                            >
                                                <span className="text-xl">📘</span>
                                                <div className="font-extrabold text-xs text-white">Export DOCX</div>
                                                <div className="text-[10px] text-[#667799]">Word document</div>
                                            </button>
                                        </div>
                                    </div>

                                    <div className="card-dark space-y-3">
                                        <span className="text-xs font-extrabold text-[#667799] uppercase tracking-wider block flex items-center gap-2">
                                            <span>Package Preview</span>
                                            <span className="voice-badge text-[8px]">
                                                <Icons.Mic />
                                                WAJIB BERSUARA {language}
                                            </span>
                                            <span className="text-[10px] text-[#10b981]">📌 URUT</span>
                                        </span>
                                        <pre className="bg-[#080c18] p-4 rounded-2xl border border-[#1a2a4a] text-xs font-mono text-[#a0b4d0] leading-relaxed overflow-x-auto max-h-96">
                                            {generateFullPackageText('md')}
                                        </pre>
                                    </div>
                                </div>
                            )}

                            {/* TAB 6: SETTINGS */}
                            {activeTab === 'settings' && (
                                <div className="max-w-xl mx-auto space-y-6">
                                    
                                    <div className="card-dark space-y-5 border-amber-500/30">
                                        
                                        <div className="flex items-center space-x-2 text-amber-400 font-extrabold text-xs uppercase tracking-wider">
                                            <Icons.Zap />
                                            <span>API SETTINGS</span>
                                        </div>

                                        <div className="space-y-2">
                                            <label className="text-xs font-bold text-[#667799] block">Pilih API Provider</label>
                                            <select
                                                value={provider}
                                                onChange={e => handleProviderChange(e.target.value)}
                                                className="input-dark font-extrabold cursor-pointer"
                                            >
                                                <option value="openrouter">🌐 OpenRouter (FREE) - REKOMENDASI</option>
                                                <option value="gemini">🔵 Google Gemini Direct API</option>
                                            </select>
                                        </div>

                                        <div className="space-y-2">
                                            <label className="text-xs font-bold text-[#667799] block">Pilih Model AI</label>
                                            <select
                                                value={selectedModel}
                                                onChange={e => setSelectedModel(e.target.value)}
                                                className="input-dark font-mono cursor-pointer"
                                            >
                                                {provider === 'openrouter' ? (
                                                    customModelList.map(m => (
                                                        <option key={m.id} value={m.id}>{m.name}</option>
                                                    ))
                                                ) : (
                                                    GEMINI_DIRECT_MODELS.map(m => (
                                                        <option key={m.id} value={m.id}>{m.name}</option>
                                                    ))
                                                )}
                                            </select>
                                        </div>

                                        <div className="space-y-2">
                                            <label className="text-xs font-bold text-[#667799] block">
                                                {provider === 'openrouter' ? 'OpenRouter API Key (sk-or-v1-...)' : 'Google Gemini API Key (AIzaSy...)'}
                                            </label>
                                            <input
                                                type="password"
                                                placeholder={provider === 'openrouter' ? 'sk-or-v1-...' : 'AIzaSy...'}
                                                value={provider === 'openrouter' ? openrouterKey : geminiKey}
                                                onChange={e => {
                                                    if (provider === 'openrouter') setOpenrouterKey(e.target.value);
                                                    else setGeminiKey(e.target.value);
                                                }}
                                                className="input-dark font-mono"
                                            />
                                        </div>

                                        <div className="grid grid-cols-3 gap-3 pt-2">
                                            <button
                                                onClick={handleTestKey}
                                                disabled={isTestingKey}
                                                className="bg-[#080c18] hover:bg-[#1a2a4a] border border-[#1a2a4a] text-[#a0b4d0] p-3 rounded-2xl text-xs font-bold flex flex-col items-center justify-center space-y-1 transition shadow-sm"
                                            >
                                                <span className="text-base">🔑</span>
                                                <span>{isTestingKey ? 'Testing...' : 'Test Key'}</span>
                                            </button>

                                            <button
                                                onClick={handleRefreshModels}
                                                disabled={isRefreshingModels}
                                                className="bg-[#080c18] hover:bg-[#1a2a4a] border border-[#1a2a4a] text-[#a0b4d0] p-3 rounded-2xl text-xs font-bold flex flex-col items-center justify-center space-y-1 transition text-center shadow-sm"
                                            >
                                                <span className="text-base">📦</span>
                                                <span className="line-clamp-1">{isRefreshingModels ? 'Refreshing...' : 'Refresh Model'}</span>
                                            </button>

                                            <button
                                                onClick={handleOpenGetKeyPage}
                                                className="bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/30 text-amber-400 p-3 rounded-2xl text-xs font-bold flex flex-col items-center justify-center space-y-1 transition shadow-sm"
                                            >
                                                <span className="text-base">📋</span>
                                                <span>Ambil Key</span>
                                            </button>
                                        </div>

                                    </div>

                                    <div className="card-dark border-[#6c5ce7]/30 bg-[#6c5ce7]/5">
                                        <h4 className="text-xs font-extrabold text-[#a855f7] uppercase tracking-wider flex items-center gap-2">
                                            <Icons.Mic />
                                            🎤 Voice Instruction Status
                                        </h4>
                                        <div className="mt-2 space-y-1 text-xs text-[#a0b4d0]">
                                            <p className="flex items-center gap-2">
                                                <span className="text-emerald-400">✅</span>
                                                <span>Video prompt WAJIB mengandung perintah karakter bersuara</span>
                                            </p>
                                            <p className="flex items-center gap-2">
                                                <span className="text-emerald-400">✅</span>
                                                <span>Bahasa suara: <strong className="text-[#a855f7]">{language}</strong></span>
                                            </p>
                                            <p className="flex items-center gap-2">
                                                <span className="text-emerald-400">✅</span>
                                                <span>Setiap panel storyboard memiliki dialogue yang diucapkan</span>
                                            </p>
                                            <p className="flex items-center gap-2">
                                                <span className="text-emerald-400">✅</span>
                                                <span>Narasi juga dibacakan dengan suara dalam {language}</span>
                                            </p>
                                            <p className="flex items-center gap-2">
                                                <span className="text-[#10b981]">📌</span>
                                                <span>Storyboards dibuat URUT & BERKESINAMBUNGAN</span>
                                            </p>
                                        </div>
                                    </div>

                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>

</body>
</html>
