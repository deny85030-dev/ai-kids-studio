        function extractJSON(text) {
            if (!text) return null;
            try { return JSON.parse(text); } catch (e) {}
            const cleaned = text.replace(/```json/gi, '').replace(/```/g, '').trim();
            try { return JSON.parse(cleaned); } catch (e) {}
            const matchObj = cleaned.match(/\{[\s\S]*\}/);
            if (matchObj) { try { return JSON.parse(matchObj[0]); } catch (e) {} }
            const matchArr = cleaned.match(/\[[\s\S]*\]/);
            if (matchArr) { try { return JSON.parse(matchArr[0]); } catch (e) {} }
            return null;
        }

        function generateFallbackStoryboards(durationObj, style, charObj, title, storyText, lang) {
            const count = durationObj?.storyboards || 3;
            const charSnippet = charObj?.masterPromptSnippet || `Main character for ${title}, ${style}`;
            const charName = charObj?.characterName || "Kiki";
            
            const paragraphs = storyText
                ? storyText.split(/\n+/).filter(p => p.trim().length > 10)
                : [];

            const boards = [];
            const totalParas = paragraphs.length;

            for (let i = 1; i <= count; i++) {
                const paraIdx = totalParas > 0 ? Math.floor(((i - 1) / count) * totalParas) : 0;
                const currentSectionText = paragraphs[paraIdx] || `Bagian adegan ${i} dari cerita "${title}".`;
                
                const prevBoardId = i > 1 ? i - 1 : null;
                const continuityNote = prevBoardId 
                    ? `🔗 Sambungan Visual: Melanjutkan transisi aksi dari Storyboard #${prevBoardId} Panel 6`
                    : `🏁 Pembuka Cerita: Pengenalan karakter awal adegan`;

                boards.push({
                    storyboardId: i,
                    sceneTitle: `Adegan ${i}: ${i === 1 ? 'Pengenalan & Awal Konflik' : i === count ? 'Klimaks & Penyelesaian' : 'Perkembangan Petualangan'} (${i}/${count})`,

                        { panelNum: 6, action: `${charName} bersiap melangkah ke adegan berikutnya`, dialogue: `Petualangan berlanjut...` }
                    ],
                    imagePrompt: `A 6-panel comic grid layout, ${style} art style. ${charSnippet}. Scene context: "${currentSectionText.substring(0, 100)}...". Panel 1 to 6 progression: character entering, observing, reacting, taking action, achieving result, transitioning to next board. Vibrant cartoon lighting, high continuity, 6-panel comic book format. Spoken dialogue in ${lang}.`,
                    videoPrompt: `Omni Flash / Sora Video Prompt (Storyboard #${i}): Cinematic smooth camera pan, ${charSnippet}. Action: ${charName} taking heroic action in "${currentSectionText.substring(0, 80)}...". Dynamic cartoon motion, lighting matching ${style}, max 10s.`
                });
            }

            return boards;
        }

        async function callUniversalAI(prompt, provider, model, openrouterKey, geminiKey, systemInstruction = "") {
            if (provider === 'openrouter') {
                if (!openrouterKey || openrouterKey.trim() === "") {
                    throw new Error("NO_KEY: Silakan masukkan OpenRouter API Key di menu API Settings.");
                }

                const endpoint = "https://openrouter.ai/api/v1/chat/completions";
                const messages = [];
                if (systemInstruction) {
                    messages.push({ role: "system", content: systemInstruction });
                }
                messages.push({ role: "user", content: prompt });

                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${openrouterKey.trim()}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.origin || "https://gemini-canvas.app",
                        "X-Title": "AI Viral Kids Studio"
                    },
                    body: JSON.stringify({
                        model: model || "openrouter/free",
                        messages: messages,
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `OpenRouter API Error (${response.status})`);
                }

                const data = await response.json();
                return data.choices?.[0]?.message?.content || "";
            } else {
                if (!geminiKey || geminiKey.trim() === "") {
                    throw new Error("NO_KEY: Silakan masukkan Google Gemini API Key di menu API Settings.");
                }

                const modelToUse = model || "gemini-2.5-flash";
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelToUse}:generateContent?key=${geminiKey.trim()}`;

                const requestBody = {
                    contents: [{ role: "user", parts: [{ text: prompt }] }]
                };

                if (systemInstruction) {
                    requestBody.systemInstruction = { parts: [{ text: systemInstruction }] };
                }

                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    if (response.status === 429 || errData.error?.message?.toLowerCase().includes("quota")) {
                        throw new Error("QUOTA_EXCEEDED: Rate limit/kuota Gemini API tercapai.");
                    }
                    throw new Error(errData.error?.message || `Gemini API Request failed (${response.status})`);
                }

                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            }
        }

        const exportAsFile = (content, filename, type) => {
            const blob = new Blob([content], { type: type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

            const currentStyleLabel = animationStyle === 'custom' ? customStyleText : (ANIMATION_STYLES.find(s => s.id === animationStyle)?.label || 'Doraemon Style');
            const targetDurationObj = DURATION_OPTIONS.find(d => d.value === duration) || DURATION_OPTIONS[1];

            const handleGenerateTitles = async () => {
                setIsGenerating(true);
                setLoadingStepText(`STEP 1: Generating 10 Viral Titles in ${language}...`);
                try {
                    const prompt = `Generate exactly 10 high-CTR, highly engaging viral cartoon animation titles for kids/family based on:

                setIsGenerating(true);
                try {
                    setLoadingStepText("STEP 7: Building Master Character Sheet...");
                    let charParsed = null;

                Theme: ${storyTheme}
                Language: ${language}

                                                <span className="text-base">📦</span>
                                                <span className="line-clamp-1">{isRefreshingModels ? 'Refreshing...' : 'Refresh Model'}</span>
                                            </button>
                                            <button onClick={handleOpenGetKeyPage} className="bg-amber-900/30 hover:bg-amber-900/50 border border-amber-500/40 text-amber-300 p-3 rounded-2xl text-xs font-bold flex flex-col items-center justify-center space-y-1 transition">
                                                <span className="text-base">📋</span>
                                                <span>Ambil Key</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }

        // RENDER APLIKASI
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
